apis:
- aid: payloadcms:rest-api
  name: Payload CMS REST API
  description: >-
    Auto-generated RESTful API for managing collections, globals, media uploads, users, and preferences.
    Mounted at /api/{collection-slug} with full CRUD operations plus authentication endpoints.
  humanURL: https://payloadcms.com/docs/rest-api/overview
  baseURL: https://{your-domain}/api
  tags:
  - REST
  - Collection
  - Globals
  - Authentication
  - Media
  tags_raw:
  - REST
  - Collections
  - Globals
  - Authentication
  - Media
  properties:
  - type: Documentation
    url: https://payloadcms.com/docs/rest-api/overview
- aid: payloadcms:graphql-api
  name: Payload CMS GraphQL API
  description: >-
    Fully featured GraphQL API exposed at /api/graphql with auto-generated types for all collections and
    globals. Includes a GraphQL Playground at /api/graphql-playground and supports complexity limiting
    to prevent abuse.
  humanURL: https://payloadcms.com/docs/graphql/overview
  baseURL: https://{your-domain}/api/graphql
  tags:
  - GraphQL
  - Collection
  - Globals
  - Authentication
  tags_raw:
  - GraphQL
