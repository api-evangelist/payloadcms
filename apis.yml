  - Globals
  - Authentication
  properties:
  - type: Documentation
    url: https://payloadcms.com/docs/graphql/overview
  - url: graphql/payloadcms-graphql.md
    type: GraphQL
- aid: payloadcms:local-api
  name: Payload CMS Local API
  description: >-
    Server-side Node.js API for direct database interaction without HTTP overhead. Supports all collection
    and global operations including authentication, ideal for React Server Components and server-side
    rendering.
  humanURL: https://payloadcms.com/docs/local-api/overview
  baseURL: https://{your-domain}
  tags:
