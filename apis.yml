  - Globals
  properties:
  - type: Documentation
    url: https://payloadcms.com/docs/local-api/overview
- aid: payloadcms:payload
  name: Payload
  description: >-
    Payload is a TypeScript-first headless CMS and application framework that automatically generates
    REST, GraphQL, and Local APIs from collection schemas, with built-in authentication, access control,
    and a Next.js admin panel.
  humanURL: https://payloadcms.com/
  baseURL: https://payloadcms.com/api
